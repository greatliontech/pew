version: "3"

tasks:
  build:
    desc: Build the pew binary
    cmds:
      - go build -o bin/pew ./cmd/pew

  test:short:
    desc: "The fast tier: the tool's code without a benchmark or a fixture-package load (seconds; the inner-loop gate)"
    cmds:
      - go test -short -count=1 ./...

  test:
    desc: "The full tier: fixture-driven runs and the analysis canaries (minutes; the merge gate, budget in .github/workflows/ci.yaml)"
    cmds:
      - go test -count=1 -timeout=15m ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy modules
    cmds:
      - go mod tidy

  check:
    desc: Vet + the fast tier
    deps: [vet, test:short]

  install:
    cmds:
      - mkdir -p $HOME/.local/bin $HOME/.local/share/zsh/site-functions
      - go build -o $HOME/.local/bin/pew ./cmd/pew
      - $HOME/.local/bin/pew completion zsh > $HOME/.local/share/zsh/site-functions/_pew
      - echo "note - ensure fpath includes ~/.local/share/zsh/site-functions before compinit"
