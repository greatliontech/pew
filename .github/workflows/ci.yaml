name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Each main commit retains its own verdict; successive PR pushes supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: greatliontech/actions/.github/workflows/go-gate.yml@main
    with:
      go-version: "1.27.1"
      short: true
      short-timeout: 5m
      full-timeout: 15m
      test-job-minutes: 30
      race: false
      records: true
      stipulator-version: v0.66.1
