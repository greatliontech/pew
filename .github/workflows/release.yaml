name: Release

# Only CI can authorize publication. The shared workflow verifies that its
# successful same-repository push still names the tip of main before tagging.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: greatliontech/actions/.github/workflows/go-release.yml@main
    permissions:
      contents: write
    secrets: inherit
